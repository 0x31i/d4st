name: airgap-bundle

# Produces an OFFLINE install bundle of the d4st image and attaches it to a GitHub
# Release, so an air-gapped host (no ghcr.io egress) can install d4st without a pull.
#
# The image (~9 GB) is `docker save | gzip`-ed, split into <2 GB parts (the Release
# asset ceiling), checksummed, and uploaded. On the target you run scripts/airgap-load.sh
# (or install.sh with D4ST_IMAGE_TAR) to reassemble + `docker load`.
#
# The bundle NEVER enters git history — it lives only as a Release asset, regenerable
# on demand. Trigger manually (choose an image tag) or automatically on a release.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to bundle (from ghcr.io/<repo>)"
        default: "core"
        required: true
      release_tag:
        description: "Release tag to attach the bundle to (created if missing)"
        default: "airgap-latest"
        required: true
  release:
    types: [published]

permissions:
  contents: write   # create/update the release + upload assets
  packages: read    # pull the image from GHCR

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GitHub runners ship ~14 GB free on /. Reclaim the big preinstalled toolchains
      # so a 9 GB image + its tarball fit comfortably.
      - name: Free up disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          df -h /

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve inputs
        id: cfg
        run: |
          IMG_TAG="${{ github.event.inputs.image_tag || 'core' }}"
          REL_TAG="${{ github.event.inputs.release_tag || github.event.release.tag_name || 'airgap-latest' }}"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${IMG_TAG}" >> "$GITHUB_OUTPUT"
          echo "reltag=${REL_TAG}" >> "$GITHUB_OUTPUT"

      - name: Pull + save + split + checksum
        run: |
          set -euo pipefail
          IMAGE="${{ steps.cfg.outputs.image }}"
          echo "Bundling $IMAGE"
          docker pull "$IMAGE"
          mkdir -p bundle
          # stream save->gzip so the uncompressed tar never hits disk
          docker save "$IMAGE" | gzip -1 > bundle/d4st-core.tar.gz
          ls -lh bundle/
          # split into 1900 MB parts (< the 2 GB Release-asset ceiling)
          split -b 1900m -d --additional-suffix=.part bundle/d4st-core.tar.gz bundle/d4st-core.tar.gz.
          rm -f bundle/d4st-core.tar.gz
          ( cd bundle && sha256sum *.part > SHA256SUMS )
          echo "$IMAGE" > bundle/IMAGE_REF.txt
          ls -lh bundle/

      - name: Publish bundle to the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.cfg.outputs.reltag }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "d4st air-gap bundle ($TAG)" \
              --notes "Offline install bundle for \`${{ steps.cfg.outputs.image }}\`. Reassemble with scripts/airgap-load.sh (or install.sh + D4ST_IMAGE_TAR)."
          fi
          gh release upload "$TAG" bundle/*.part bundle/SHA256SUMS bundle/IMAGE_REF.txt --clobber
