# EHRM 3.0 (FHC staging) login recipe — Angular SPA, form login at /login.
# Selectors confirmed by rendering the live login page:
#   username -> input[formcontrolname=txtUserName]  (type=email, placeholder "User Name")
#   password -> input[formcontrolname=txtPassword]
#   submit   -> button[type=submit]                 (text "Login")
# Creds come from env (EHRM_USERNAME / EHRM_PASSWORD) so they never live in this file.
# A one-off run can override with:  auth capture -u <user> -w <pass>
name: ehrm
type: form
base_url_env: D4ST_EHRM_URL
login_url: "{base}/login"
username_selector: "input[formcontrolname=txtUserName]"
password_selector: "input[formcontrolname=txtPassword]"
submit_selector: "button[type=submit]"
username_env: EHRM_USERNAME
password_env: EHRM_PASSWORD

# Post-login: successful login routes to /provider/new (provider home) — confirmed live.
# Markers taken from that authenticated page (stable UI, not user-specific).
success:
  url_contains: "/provider"
  body_contains: "Patient Search"

validity:
  url: "{base}/provider/new"
  body_contains: "Patient Search"
  render: true          # SPA: the logged-in marker is client-rendered, so probe with a browser

totp:
  enabled: false
  # If MFA turns out to be TOTP:  enabled: true, seed_env: EHRM_TOTP_SEED, selector: "<otp input>"
