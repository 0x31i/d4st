# OCWA (OVERCLOCK Web Application) login recipe. DVWA-derived, but post-login lands on
# homepage.php (not index.php). Base URL supplied at run time (--base or DASTNG_OCWA_URL).
name: ocwa
type: form
base_url_env: DASTNG_OCWA_URL
login_url: "{base}/login.php"
username_selector: "input[name=username]"
password_selector: "input[name=password]"
submit_selector: "input[name=Login], input[type=submit]"
username: admin
password: password
# Override creds without committing them: export DASTNG_OCWA_USER / DASTNG_OCWA_PASS
username_env: DASTNG_OCWA_USER
password_env: DASTNG_OCWA_PASS

success:
  url_contains: "homepage.php"
  body_contains: "Logout"

validity:
  url: "{base}/homepage.php"
  body_contains: "Logout"

# OCWA carries the DVWA-style security cookie; default medium, overridable via --security.
post_login_cookies:
  - name: security
    value: medium
    path: "/"

totp:
  enabled: false
